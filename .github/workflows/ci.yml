name: CI

on:
  push:
    branches:
      - stable
      - main
      - 4.1-update
    tags:
      - '*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.os.name }} ${{ matrix.python.name }}
    runs-on: ${{ matrix.os.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: 🐧
            runs-on: ubuntu-latest
        python:
          - name: CPython 3.11
            major_dot_minor: '3.11'
            action: '3.11'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        # with:
          # This allows the matrix to specify just the major.minor version while still
          # expanding it to get the latest patch version including alpha releases.
          # This avoids the need to update for each new alpha, beta, release candidate,
          # and then finally an actual release version.  actions/setup-python doesn't
          # support this for PyPy presently so we get no help there.
          #
          # CPython -> 3.11.0-alpha - 3.11.X
          # PyPy    -> pypy-3.7
          # python-version: ${{ fromJSON(format('["{0}", "{1}"]', format('{0}.0-alpha - {0}.X', matrix.python.action), matrix.python.action))[startsWith(matrix.python.action, 'pypy')] }}
          # architecture: x64

      - name: Setup environment
        run: |
          python -m pip install build

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Publish package files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*
          if-no-files-found: error

  test-standard:
    name: Test ${{ matrix.os.name }} ${{ matrix.python.name }}
    needs:
      - build
    runs-on: ${{ matrix.os.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: 🐧
            runs-on: ubuntu-latest
          - name: 🍎
            runs-on: macos-15
          - name: 🪟
            runs-on: windows-latest
        python:
          - name: CPython 3.11
            major_dot_minor: '3.11'
            action: '3.11'
          - name: CPython 3.12
            major_dot_minor: '3.12'
            action: '3.12'
          - name: CPython 3.13
            major_dot_minor: '3.13'
            action: '3.13'
          - name: CPython 3.14
            major_dot_minor: '3.14'
            action: '3.14'
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Download package files
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - uses: actions/setup-python@v5
        with:
          # This allows the matrix to specify just the major.minor version while still
          # expanding it to get the latest patch version including alpha releases.
          # This avoids the need to update for each new alpha, beta, release candidate,
          # and then finally an actual release version.  actions/setup-python doesn't
          # support this for PyPy presently so we get no help there.
          #
          # CPython -> 3.11.0-alpha - 3.11.X
          # PyPy    -> pypy-3.7
          python-version: ${{ fromJSON(format('["{0}", "{1}"]', format('{0}.0-alpha - {0}.X', matrix.python.action), matrix.python.action))[startsWith(matrix.python.action, 'pypy')] }}
          architecture: x64

      - name: Setup environment
        run: |
          python --version --version
          # make sure we test the installed code
          cp -R repo/tests/ tests/
          python -m pip install -r tests/requirements.txt
          python -m pip install ./dist/*.whl
          # show the directory contents for diagnostics
          ls -la

      - name: Run pytest
        run: |
          python -m pytest tests/ --benchmark-disable

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs:
      - build
      - test-standard
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - name: Download package files
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'dist/*'

      # The tag and the version in pyproject.toml are written by hand, so check
      # they agree before anything is uploaded - a mismatch can't be undone on PyPI.
      - name: Check the tag matches the built version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          version=$(basename dist/*.tar.gz .tar.gz)
          version=${version#bitstring-}
          tag=${GITHUB_REF#refs/tags/}
          echo "tag: $tag, built version: $version"
          if [[ "$tag" != *"$version" ]]; then
            echo "::error::Tag '$tag' doesn't match the built version '$version'"
            exit 1
          fi

      - name: Install uv
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: astral-sh/setup-uv@v7

      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: uv publish 'dist/*'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

      - name: Upload to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}

  all:
    name: All successful
    runs-on: ubuntu-latest
    # The always() part is very important.
    # If not set, the job will be skipped on failing dependencies.
    if: always()
    needs:
      # This is the list of CI job that we are interested to be green before
      # a merge.
      - build
      - test-standard
    steps:
      - name: Require all successes
        uses: re-actors/alls-green@v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
